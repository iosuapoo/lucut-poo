<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-Room Grand Mansion 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0f0f0;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 3px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui-layer">
        <div class="hud-card">
            <h1>20-Room Grand Mansion</h1>
            <p><strong>WASD / Arrows</strong> — Move</p>
            <p><strong>Shift</strong> — Sprint</p>
            <p><strong>Space</strong> — Jump</p>
            <p><strong>Click Screen</strong> — Lock Mouse & Look Around</p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script>
        const CONFIG = {
            fov: 75,
            near: 0.1,
            far: 600,
            playerHeight: 2.2,
            walkSpeed: 12.0,
            runSpeed: 24.0,
            jumpForce: 10.0,
            gravity: 25.0
        };

        let scene;
        let camera;
        let renderer;
        let controls;
        let clock = new THREE.Clock();

        let moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            sprint: false,
            jump: false
        };

        let velocity = new THREE.Vector3();
        let canJump = false;
        let flickeringLights = [];

        const TextureFactory = {
            createSolidWood: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2b1704';
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#3a1f06';
                ctx.fillRect(0, 0, 62, 62);
                ctx.fillRect(64, 64, 62, 62);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },
            createSolidWall: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1c0c10';
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#3d1c24';
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, 128, 128);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },
            createSolidMarble: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#dcdcdc';
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }
        };

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.008);
            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, CONFIG.near, CONFIG.far);
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = false;
            container.appendChild(renderer.domElement);
            controls = new THREE.PointerLockControls(camera, document.body);
            document.addEventListener('click', () => controls.lock());
            setupInputs();
            buildOptimizedMansion();
            setupLights();
            window.addEventListener('resize', onWindowResize);
        }

        function setupInputs() {
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        moveState.forward = true;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = true;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        moveState.left = true;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = true;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.sprint = true;
                        break;
                    case 'Space':
                        if (canJump) velocity.y += CONFIG.jumpForce;
                        canJump = false;
                        break;
                }
            });
            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        moveState.forward = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = false;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        moveState.left = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.sprint = false;
                        break;
                }
            });
        }

        function buildOptimizedMansion() {
            const woodTex = TextureFactory.createSolidWood();
            woodTex.repeat.set(40, 40);
            const wallTex = TextureFactory.createSolidWall();
            wallTex.repeat.set(20, 5);
            const marbleTex = TextureFactory.createSolidMarble();

            const matWood = new THREE.MeshLambertMaterial({ map: woodTex, opacity: 1.0, transparent: false });
            const matWall = new THREE.MeshLambertMaterial({ map: wallTex, opacity: 1.0, transparent: false });
            const matMarble = new THREE.MeshLambertMaterial({ map: marbleTex, opacity: 1.0, transparent: false });

            const wallGeometries = [];
            const floorGeometries = [];

            const groundFloor = new THREE.BoxGeometry(400, 1, 400);
            groundFloor.translate(0, -0.5, 0);
            floorGeometries.push(groundFloor);

            const secondFloor = new THREE.BoxGeometry(400, 1, 400);
            secondFloor.translate(0, 19.5, 0);
            floorGeometries.push(secondFloor);

            const ceiling = new THREE.BoxGeometry(400, 1, 400);
            ceiling.translate(0, 40, 0);
            wallGeometries.push(ceiling);

            function addWall(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                geo.translate(x, y, z);
                wallGeometries.push(geo);
            }

            // Outer Perimeter
            addWall(400, 40, 2, 0, 20, -200);
            addWall(400, 40, 2, 0, 20, 200);
            addWall(2, 40, 400, -200, 20, 0);
            addWall(2, 40, 400, 200, 20, 0);

            // Ground Floor Walls - Room 1
            addWall(50, 20, 2, -150, 10, -140);
            addWall(2, 20, 50, -175, 10, -140);
            // Ground Floor Walls - Room 2
            addWall(50, 20, 2, -150, 10, -70);
            addWall(2, 20, 50, -175, 10, -70);
            // Ground Floor Walls - Room 3
            addWall(50, 20, 2, -150, 10, 0);
            addWall(2, 20, 50, -175, 10, 0);
            // Ground Floor Walls - Room 4
            addWall(50, 20, 2, -150, 10, 70);
            addWall(2, 20, 50, -175, 10, 70);
            // Ground Floor Walls - Room 5
            addWall(50, 20, 2, -150, 10, 140);
            addWall(2, 20, 50, -175, 10, 140);

            // Ground Floor Walls - Room 6
            addWall(50, 20, 2, -80, 10, -140);
            addWall(2, 20, 50, -105, 10, -140);
            // Ground Floor Walls - Room 7
            addWall(50, 20, 2, -80, 10, -70);
            addWall(2, 20, 50, -105, 10, -70);
            // Ground Floor Walls - Room 8
            addWall(50, 20, 2, -80, 10, 0);
            addWall(2, 20, 50, -105, 10, 0);
            // Ground Floor Walls - Room 9
            addWall(50, 20, 2, -80, 10, 70);
            addWall(2, 20, 50, -105, 10, 70);
            // Ground Floor Walls - Room 10
            addWall(50, 20, 2, -80, 10, 140);
            addWall(2, 20, 50, -105, 10, 140);

            // Ground Floor Walls - Room 11
            addWall(50, 20, 2, 80, 10, -140);
            addWall(2, 20, 50, 55, 10, -140);
            // Ground Floor Walls - Room 12
            addWall(50, 20, 2, 80, 10, -70);
            addWall(2, 20, 50, 55, 10, -70);
            // Ground Floor Walls - Room 13
            addWall(50, 20, 2, 80, 10, 0);
            addWall(2, 20, 50, 55, 10, 0);
            // Ground Floor Walls - Room 14
            addWall(50, 20, 2, 80, 10, 70);
            addWall(2, 20, 50, 55, 10, 70);
            // Ground Floor Walls - Room 15
            addWall(50, 20, 2, 80, 10, 140);
            addWall(2, 20, 50, 55, 10, 140);

            // Ground Floor Walls - Room 16
            addWall(50, 20, 2, 150, 10, -140);
            addWall(2, 20, 50, 125, 10, -140);
            // Ground Floor Walls - Room 17
            addWall(50, 20, 2, 150, 10, -70);
            addWall(2, 20, 50, 125, 10, -70);
            // Ground Floor Walls - Room 18
            addWall(50, 20, 2, 150, 10, 0);
            addWall(2, 20, 50, 125, 10, 0);
            // Ground Floor Walls - Room 19
            addWall(50, 20, 2, 150, 10, 70);
            addWall(2, 20, 50, 125, 10, 70);
            // Ground Floor Walls - Room 20
            addWall(50, 20, 2, 150, 10, 140);
            addWall(2, 20, 50, 125, 10, 140);

            // Second Floor Walls - Upper Suite 1
            addWall(50, 20, 2, -150, 30, -140);
            addWall(2, 20, 50, -175, 30, -140);
            // Second Floor Walls - Upper Suite 2
            addWall(50, 20, 2, -150, 30, -70);
            addWall(2, 20, 50, -175, 30, -70);
            // Second Floor Walls - Upper Suite 3
            addWall(50, 20, 2, -150, 30, 0);
            addWall(2, 20, 50, -175, 30, 0);
            // Second Floor Walls - Upper Suite 4
            addWall(50, 20, 2, -150, 30, 70);
            addWall(2, 20, 50, -175, 30, 70);
            // Second Floor Walls - Upper Suite 5
            addWall(50, 20, 2, -150, 30, 140);
            addWall(2, 20, 50, -175, 30, 140);

            // Second Floor Walls - Upper Suite 6
            addWall(50, 20, 2, -80, 30, -140);
            addWall(2, 20, 50, -105, 30, -140);
            // Second Floor Walls - Upper Suite 7
            addWall(50, 20, 2, -80, 30, -70);
            addWall(2, 20, 50, -105, 30, -70);
            // Second Floor Walls - Upper Suite 8
            addWall(50, 20, 2, -80, 30, 0);
            addWall(2, 20, 50, -105, 30, 0);
            // Second Floor Walls - Upper Suite 9
            addWall(50, 20, 2, -80, 30, 70);
            addWall(2, 20, 50, -105, 30, 70);
            // Second Floor Walls - Upper Suite 10
            addWall(50, 20, 2, -80, 30, 140);
            addWall(2, 20, 50, -105, 30, 140);

            // Second Floor Walls - Upper Suite 11
            addWall(50, 20, 2, 80, 30, -140);
            addWall(2, 20, 50, 55, 30, -140);
            // Second Floor Walls - Upper Suite 12
            addWall(50, 20, 2, 80, 30, -70);
            addWall(2, 20, 50, 55, 30, -70);
            // Second Floor Walls - Upper Suite 13
            addWall(50, 20, 2, 80, 30, 0);
            addWall(2, 20, 50, 55, 30, 0);
            // Second Floor Walls - Upper Suite 14
            addWall(50, 20, 2, 80, 30, 70);
            addWall(2, 20, 50, 55, 30, 70);
            // Second Floor Walls - Upper Suite 15
            addWall(50, 20, 2, 80, 30, 140);
            addWall(2, 20, 50, 55, 30, 140);

            // Second Floor Walls - Upper Suite 16
            addWall(50, 20, 2, 150, 30, -140);
            addWall(2, 20, 50, 125, 30, -140);
            // Second Floor Walls - Upper Suite 17
            addWall(50, 20, 2, 150, 30, -70);
            addWall(2, 20, 50, 125, 30, -70);
            // Second Floor Walls - Upper Suite 18
            addWall(50, 20, 2, 150, 30, 0);
            addWall(2, 20, 50, 125, 30, 0);
            // Second Floor Walls - Upper Suite 19
            addWall(50, 20, 2, 150, 30, 70);
            addWall(2, 20, 50, 125, 30, 70);
            // Second Floor Walls - Upper Suite 20
            addWall(50, 20, 2, 150, 30, 140);
            addWall(2, 20, 50, 125, 30, 140);

            const mergedWalls = THREE.BufferGeometryUtils.mergeBufferGeometries(wallGeometries);
            scene.add(new THREE.Mesh(mergedWalls, matWall));

            const mergedFloors = THREE.BufferGeometryUtils.mergeBufferGeometries(floorGeometries);
            scene.add(new THREE.Mesh(mergedFloors, matWood));

            // Stair Steps
            const stairGeometries = [];
            const step0 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step0.translate(0, 0.5, -20.0);
            stairGeometries.push(step0);
            const step1 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step1.translate(0, 1.5, -22.0);
            stairGeometries.push(step1);
            const step2 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step2.translate(0, 2.5, -24.0);
            stairGeometries.push(step2);
            const step3 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step3.translate(0, 3.5, -26.0);
            stairGeometries.push(step3);
            const step4 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step4.translate(0, 4.5, -28.0);
            stairGeometries.push(step4);
            const step5 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step5.translate(0, 5.5, -30.0);
            stairGeometries.push(step5);
            const step6 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step6.translate(0, 6.5, -32.0);
            stairGeometries.push(step6);
            const step7 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step7.translate(0, 7.5, -34.0);
            stairGeometries.push(step7);
            const step8 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step8.translate(0, 8.5, -36.0);
            stairGeometries.push(step8);
            const step9 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step9.translate(0, 9.5, -38.0);
            stairGeometries.push(step9);
            const step10 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step10.translate(0, 10.5, -40.0);
            stairGeometries.push(step10);
            const step11 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step11.translate(0, 11.5, -42.0);
            stairGeometries.push(step11);
            const step12 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step12.translate(0, 12.5, -44.0);
            stairGeometries.push(step12);
            const step13 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step13.translate(0, 13.5, -46.0);
            stairGeometries.push(step13);
            const step14 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step14.translate(0, 14.5, -48.0);
            stairGeometries.push(step14);
            const step15 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step15.translate(0, 15.5, -50.0);
            stairGeometries.push(step15);
            const step16 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step16.translate(0, 16.5, -52.0);
            stairGeometries.push(step16);
            const step17 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step17.translate(0, 17.5, -54.0);
            stairGeometries.push(step17);
            const step18 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step18.translate(0, 18.5, -56.0);
            stairGeometries.push(step18);
            const step19 = new THREE.BoxGeometry(30, 1.0, 2.0);
            step19.translate(0, 19.5, -58.0);
            stairGeometries.push(step19);

            const mergedStairs = THREE.BufferGeometryUtils.mergeBufferGeometries(stairGeometries);
            scene.add(new THREE.Mesh(mergedStairs, matMarble));
        }

        function createPointLightInstance(x, y, z, color, intensity, distance) {
            const light = new THREE.PointLight(color, intensity, distance);
            light.position.set(x, y, z);
            scene.add(light);
            flickeringLights.push({
                light: light,
                baseIntensity: intensity,
                speed: 10 + Math.random() * 20
            });
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            // Exterior Perimeter Lights
            createPointLightInstance(-210, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(-140, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(-70, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(0, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(70, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(140, 15, -210, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, -210, 0xffaa44, 1.5, 90);

            createPointLightInstance(-210, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(-140, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(-70, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(0, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(70, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(140, 15, 210, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, 210, 0xffaa44, 1.5, 90);

            createPointLightInstance(-210, 15, -140, 0xffaa44, 1.5, 90);
            createPointLightInstance(-210, 15, -70, 0xffaa44, 1.5, 90);
            createPointLightInstance(-210, 15, 0, 0xffaa44, 1.5, 90);
            createPointLightInstance(-210, 15, 70, 0xffaa44, 1.5, 90);
            createPointLightInstance(-210, 15, 140, 0xffaa44, 1.5, 90);

            createPointLightInstance(210, 15, -140, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, -70, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, 0, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, 70, 0xffaa44, 1.5, 90);
            createPointLightInstance(210, 15, 140, 0xffaa44, 1.5, 90);

            // Ground Floor Interior Room Lights
            createPointLightInstance(-150, 18, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 18, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 18, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 18, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 18, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(-80, 18, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 18, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 18, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 18, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 18, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(80, 18, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 18, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 18, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 18, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 18, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(150, 18, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 18, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 18, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 18, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 18, 140, 0xffaa44, 1.4, 80);

            // Second Floor Interior Room Lights
            createPointLightInstance(-150, 38, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 38, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 38, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 38, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-150, 38, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(-80, 38, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 38, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 38, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 38, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(-80, 38, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(80, 38, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 38, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 38, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 38, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(80, 38, 140, 0xffaa44, 1.4, 80);

            createPointLightInstance(150, 38, -140, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 38, -70, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 38, 0, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 38, 70, 0xffaa44, 1.4, 80);
            createPointLightInstance(150, 38, 140, 0xffaa44, 1.4, 80);
        }

        function animateFlicker(time) {
            for (let i = 0; i < flickeringLights.length; i++) {
                const item = flickeringLights[i];
                const noise = Math.sin(time * item.speed);
                if (Math.random() > 0.94) {
                    item.light.intensity = item.baseIntensity * 0.1;
                } else {
                    item.light.intensity = item.baseIntensity + (noise * 0.3);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            animateFlicker(elapsedTime);

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= CONFIG.gravity * delta;

                const speed = moveState.sprint ? CONFIG.runSpeed : CONFIG.walkSpeed;

                const moveVector = new THREE.Vector3();
                if (moveState.forward) moveVector.z += 1;
                if (moveState.backward) moveVector.z -= 1;
                if (moveState.left) moveVector.x -= 1;
                if (moveState.right) moveVector.x += 1;
                moveVector.normalize();

                if (moveState.forward || moveState.backward) velocity.z += moveVector.z * speed * 10.0 * delta;
                if (moveState.left || moveState.right) velocity.x += moveVector.x * speed * 10.0 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                const playerPos = controls.getObject().position;

                let currentFloorHeight = 0;

                if (playerPos.z <= -20 && playerPos.z >= -60 && Math.abs(playerPos.x) <= 20) {
                    const stairProgress = Math.min(1.0, Math.max(0.0, (-20 - playerPos.z) / 40));
                    currentFloorHeight = stairProgress * 20;
                } else if (playerPos.y >= 18) {
                    currentFloorHeight = 20;
                }

                if (playerPos.y < currentFloorHeight + CONFIG.playerHeight) {
                    velocity.y = 0;
                    playerPos.y = currentFloorHeight + CONFIG.playerHeight;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initEngine();
            animate();
        };
    </script>
</body>
</html>
