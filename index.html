<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Mansion 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0f0f0;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 3px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
    <!-- Three.js and PointerLock Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui-layer">
        <div class="hud-card">
            <h1>Grand Mansion Interior</h1>
            <p><strong>WASD / Arrows</strong> — Move</p>
            <p><strong>Shift</strong> — Sprint</p>
            <p><strong>Space</strong> — Jump</p>
            <p><strong>Click Screen</strong> — Lock Mouse & Look Around</p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script>
        // ===================================================================
        // 1. ENGINE CONFIGURATION & GLOBAL STATE
        // ===================================================================
        const CONFIG = {
            fov: 75,
            near: 0.1,
            far: 1000,
            playerHeight: 2.2,
            walkSpeed: 10.0,
            runSpeed: 20.0,
            jumpForce: 10.0,
            gravity: 25.0,
            mansionWidth: 240,
            mansionLength: 240,
            wallHeight: 40,
            floorTwoHeight: 20
        };

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        let moveState = { forward: false, backward: false, left: false, right: false, sprint: false, jump: false };
        let velocity = new THREE.Vector3();
        let canJump = false;
        let flickeringLights = [];

        // ===================================================================
        // 2. PROCEDURAL TEXTURE GENERATOR
        // ===================================================================
        const TextureFactory = {
            createParquetWood: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2b1704';
                ctx.fillRect(0, 0, 1024, 1024);

                const plankSize = 128;
                for (let x = 0; x < 1024; x += plankSize) {
                    for (let y = 0; y < 1024; y += plankSize) {
                        const isHorizontal = ((x / plankSize) + (y / plankSize)) % 2 === 0;
                        ctx.fillStyle = isHorizontal ? '#3a1f06' : '#2d1804';
                        ctx.fillRect(x, y, plankSize - 2, plankSize - 2);

                        ctx.strokeStyle = 'rgba(10, 5, 0, 0.25)';
                        ctx.lineWidth = 2;
                        const numLines = 8;
                        for (let i = 0; i < numLines; i++) {
                            ctx.beginPath();
                            if (isHorizontal) {
                                const lineY = y + (i * (plankSize / numLines));
                                ctx.moveTo(x, lineY);
                                ctx.lineTo(x + plankSize - 2, lineY);
                            } else {
                                const lineX = x + (i * (plankSize / numLines));
                                ctx.moveTo(lineX, y);
                                ctx.lineTo(lineX, y + plankSize - 2);
                            }
                            ctx.stroke();
                        }
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createDamaskWallpaper: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#1c0c10';
                ctx.fillRect(0, 0, 1024, 1024);

                ctx.fillStyle = '#2a1218';
                for (let x = 0; x < 1024; x += 128) {
                    ctx.fillRect(x + 16, 0, 96, 1024);
                }

                ctx.strokeStyle = '#3d1c24';
                ctx.lineWidth = 4;
                for (let x = -512; x < 1536; x += 128) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x + 1024, 1024);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x, 1024);
                    ctx.lineTo(x + 1024, 0);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createMarbleTexture: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#eaeaea';
                ctx.fillRect(0, 0, 512, 512);

                ctx.strokeStyle = '#9999a0';
                ctx.lineWidth = 3;
                for (let i = 0; i < 16; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 512, 0);
                    ctx.bezierCurveTo(
                        Math.random() * 512, 170, 
                        Math.random() * 512, 340, 
                        Math.random() * 512, 512
                    );
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createRugTexture: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#5c1010';
                ctx.fillRect(0, 0, 512, 512);

                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 12;
                ctx.strokeRect(20, 20, 472, 472);

                ctx.lineWidth = 4;
                ctx.strokeRect(36, 36, 440, 440);

                ctx.fillStyle = '#d4af37';
                ctx.beginPath();
                ctx.arc(256, 256, 80, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#5c1010';
                ctx.beginPath();
                ctx.arc(256, 256, 60, 0, Math.PI * 2);
                ctx.fill();

                return new THREE.CanvasTexture(canvas);
            }
        };

        // ===================================================================
        // 3. GRAPHICS ENGINE INITIALIZATION
        // ===================================================================
        function initEngine() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.007);

            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, CONFIG.near, CONFIG.far);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.addEventListener('click', () => controls.lock());

            setupInputs();
            buildMansion();
            setupLighting();

            window.addEventListener('resize', onWindowResize);
        }

        // ===================================================================
        // 4. INPUT MANAGEMENT
        // ===================================================================
        function setupInputs() {
            const onKeyDown = (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = true; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = true; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = true; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = true; break;
                    case 'Space': if (canJump) velocity.y += CONFIG.jumpForce; canJump = false; break;
                }
            };

            const onKeyUp = (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = false; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = false; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = false; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        // ===================================================================
        // 5. EXPANDED ARCHITECTURE, MULTI-FLOOR STRUCTURE & STAIRS
        // ===================================================================
        function buildMansion() {
            const parquetTex = TextureFactory.createParquetWood();
            parquetTex.repeat.set(30, 30);

            const wallpaperTex = TextureFactory.createDamaskWallpaper();
            wallpaperTex.repeat.set(15, 5);

            const marbleTex = TextureFactory.createMarbleTexture();
            marbleTex.repeat.set(4, 16);

            const rugTex = TextureFactory.createRugTexture();

            const materials = {
                woodFloor: new THREE.MeshStandardMaterial({ map: parquetTex, roughness: 0.25, metalness: 0.1, opacity: 1.0, transparent: false }),
                walls: new THREE.MeshStandardMaterial({ map: wallpaperTex, roughness: 0.85, metalness: 0.05, opacity: 1.0, transparent: false }),
                marble: new THREE.MeshStandardMaterial({ map: marbleTex, roughness: 0.1, metalness: 0.1, opacity: 1.0, transparent: false }),
                gold: new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.2, opacity: 1.0, transparent: false }),
                darkWood: new THREE.MeshStandardMaterial({ color: 0x241408, roughness: 0.4, metalness: 0.1, opacity: 1.0, transparent: false }),
                rug: new THREE.MeshStandardMaterial({ map: rugTex, roughness: 0.9, opacity: 1.0, transparent: false })
            };

            const mansionGroup = new THREE.Group();

            // Ground Floor Base (240x240 units)
            const floorGeo = new THREE.BoxGeometry(240, 1, 240);
            const mainFloor = new THREE.Mesh(floorGeo, materials.woodFloor);
            mainFloor.position.y = -0.5;
            mainFloor.receiveShadow = true;
            mansionGroup.add(mainFloor);

            // Second Floor Mezzanine
            const secondFloorGroup = new THREE.Group();
            
            const leftUpperFloor = new THREE.Mesh(new THREE.BoxGeometry(90, 1, 240), materials.woodFloor);
            leftUpperFloor.position.set(-75, 20, 0);
            leftUpperFloor.receiveShadow = true;
            secondFloorGroup.add(leftUpperFloor);

            const rightUpperFloor = new THREE.Mesh(new THREE.BoxGeometry(90, 1, 240), materials.woodFloor);
            rightUpperFloor.position.set(75, 20, 0);
            rightUpperFloor.receiveShadow = true;
            secondFloorGroup.add(rightUpperFloor);

            const frontUpperFloor = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 100), materials.woodFloor);
            frontUpperFloor.position.set(0, 20, 70);
            frontUpperFloor.receiveShadow = true;
            secondFloorGroup.add(frontUpperFloor);

            const backUpperFloor = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 40), materials.woodFloor);
            backUpperFloor.position.set(0, 20, -100);
            backUpperFloor.receiveShadow = true;
            secondFloorGroup.add(backUpperFloor);

            mansionGroup.add(secondFloorGroup);

            // Roof / Ceiling (40 units tall)
            const ceilingGeo = new THREE.BoxGeometry(240, 1, 240);
            const ceiling = new THREE.Mesh(ceilingGeo, materials.walls);
            ceiling.position.y = 40;
            ceiling.receiveShadow = true;
            mansionGroup.add(ceiling);

            // Wall Helper
            function createWall(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, materials.walls);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mansionGroup.add(mesh);
            }

            // Outer Perimeter Walls (240x240 Enclosure, 40 High)
            createWall(240, 40, 1, 0, 20, -120); // Back
            createWall(1, 40, 240, -120, 20, 0); // Left
            createWall(1, 40, 240, 120, 20, 0);  // Right
            createWall(90, 40, 1, -75, 20, 120); // Front Left
            createWall(90, 40, 1, 75, 20, 120);  // Front Right

            // Grand Marble Columns
            const pillarGeo = new THREE.CylinderGeometry(2.2, 2.6, 40, 32);
            const pillarPositions = [
                [-30, 20, -35], [30, 20, -35],
                [-30, 20, 35],  [30, 20, 35],
                [-85, 20, -35], [85, 20, -35],
                [-85, 20, 35],  [85, 20, 35]
            ];
            pillarPositions.forEach(pos => {
                const pillar = new THREE.Mesh(pillarGeo, materials.marble);
                pillar.position.set(pos[0], pos[1], pos[2]);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                mansionGroup.add(pillar);
            });

            // GRAND DOUBLE-WINGED STAIRCASE
            const stairStepCount = 22;
            const stairWidth = 14;
            const stepDepth = 1.8;
            const stepHeight = 20 / stairStepCount;

            // Central Base Ramp Steps
            for (let i = 0; i < stairStepCount / 2; i++) {
                const stepGeo = new THREE.BoxGeometry(stairWidth * 1.6, stepHeight, stepDepth);
                const step = new THREE.Mesh(stepGeo, materials.marble);
                step.position.set(0, (i * stepHeight) + (stepHeight / 2), -25 - (i * stepDepth));
                step.castShadow = true;
                step.receiveShadow = true;
                mansionGroup.add(step);
            }

            // Central Landing Platform
            const landingGeo = new THREE.BoxGeometry(stairWidth * 2.8, stepHeight, stepDepth * 4);
            const landing = new THREE.Mesh(landingGeo, materials.marble);
            landing.position.set(0, 10, -25 - ((stairStepCount / 2) * stepDepth));
            landing.castShadow = true;
            landing.receiveShadow = true;
            mansionGroup.add(landing);

            // Left & Right Branching Upper Stairs
            for (let i = 0; i < stairStepCount / 2; i++) {
                const yPos = 10 + (i * stepHeight) + (stepHeight / 2);
                const zPos = -25 - ((stairStepCount / 2) * stepDepth) - (i * stepDepth);

                // Left Wing
                const stepLeft = new THREE.Mesh(new THREE.BoxGeometry(stairWidth, stepHeight, stepDepth), materials.marble);
                stepLeft.position.set(-18 - (i * 0.9), yPos, zPos);
                stepLeft.castShadow = true;
                stepLeft.receiveShadow = true;
                mansionGroup.add(stepLeft);

                // Right Wing
                const stepRight = new THREE.Mesh(new THREE.BoxGeometry(stairWidth, stepHeight, stepDepth), materials.marble);
                stepRight.position.set(18 + (i * 0.9), yPos, zPos);
                stepRight.castShadow = true;
                stepRight.receiveShadow = true;
                mansionGroup.add(stepRight);
            }

            // Rug
            const rugGeo = new THREE.PlaneGeometry(40, 70);
            const rug = new THREE.Mesh(rugGeo, materials.rug);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.02, 25);
            rug.receiveShadow = true;
            mansionGroup.add(rug);

            // Central Chandelier Assembly
            const chandelierGroup = new THREE.Group();
            const ringGeo1 = new THREE.TorusGeometry(10, 0.3, 12, 32);
            const ring1 = new THREE.Mesh(ringGeo1, materials.gold);
            ring1.rotation.x = Math.PI / 2;
            chandelierGroup.add(ring1);

            const ringGeo2 = new THREE.TorusGeometry(6, 0.2, 12, 32);
            const ring2 = new THREE.Mesh(ringGeo2, materials.gold);
            ring2.rotation.x = Math.PI / 2;
            ring2.position.y = -2.5;
            chandelierGroup.add(ring2);

            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const cx = Math.cos(angle) * 10;
                const cz = Math.sin(angle) * 10;

                const candleGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.4, 8);
                const candleMat = new THREE.MeshBasicMaterial({ color: 0xffeedd });
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.set(cx, 0.7, cz);
                chandelierGroup.add(candle);

                const cLight = new THREE.PointLight(0xffaa44, 0.8, 35);
                cLight.position.set(cx, 1.8, cz);
                chandelierGroup.add(cLight);
                flickeringLights.push({ light: cLight, baseIntensity: 0.8, speed: 12 + Math.random() * 8 });
            }

            chandelierGroup.position.set(0, 32, 0);
            mansionGroup.add(chandelierGroup);

            scene.add(mansionGroup);
        }

        // ===================================================================
        // 6. DYNAMIC TWITCHING & FLICKERING LIGHTING SYSTEM
        // ===================================================================
        function setupLighting() {
            const ambient = new THREE.AmbientLight(0x221a24, 0.35);
            scene.add(ambient);

            // Ambient Twitching Point Lights
            const lightConfigs = [
                { pos: [0, 18, 40], color: 0xffb866, intensity: 2.0, distance: 80 },
                { pos: [-70, 34, -50], color: 0xff8844, intensity: 1.5, distance: 60 },
                { pos: [70, 34, -50], color: 0xff8844, intensity: 1.5, distance: 60 },
                { pos: [-70, 16, 50], color: 0xffaa55, intensity: 1.2, distance: 50 },
                { pos: [70, 16, 50], color: 0xffaa55, intensity: 1.2, distance: 50 },
                { pos: [0, 8, -60], color: 0xff3300, intensity: 2.5, distance: 50 }
            ];

            lightConfigs.forEach(cfg => {
                const light = new THREE.PointLight(cfg.color, cfg.intensity, cfg.distance);
                light.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
                light.castShadow = true;
                scene.add(light);

                flickeringLights.push({
                    light: light,
                    baseIntensity: cfg.intensity,
                    speed: 10 + Math.random() * 20
                });
            });
        }

        function animateFlicker(time) {
            flickeringLights.forEach(item => {
                // Wave noise coupled with random intensity drops
                const noise = Math.sin(time * item.speed) * Math.cos(time * item.speed * 0.7);
                const isTwitch = Math.random() > 0.92;
                
                if (isTwitch) {
                    item.light.intensity = item.baseIntensity * (Math.random() * 0.15);
                } else {
                    item.light.intensity = item.baseIntensity + (noise * 0.4);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===================================================================
        // 7. PHYSICS & RENDER LOOP
        // ===================================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            animateFlicker(elapsedTime);

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= CONFIG.gravity * delta;

                const speed = moveState.sprint ? CONFIG.runSpeed : CONFIG.walkSpeed;

                const moveVector = new THREE.Vector3();
                if (moveState.forward) moveVector.z += 1;
                if (moveState.backward) moveVector.z -= 1;
                if (moveState.left) moveVector.x -= 1;
                if (moveState.right) moveVector.x += 1;
                moveVector.normalize();

                if (moveState.forward || moveState.backward) velocity.z += moveVector.z * speed * 10.0 * delta;
                if (moveState.left || moveState.right) velocity.x += moveVector.x * speed * 10.0 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                const playerPos = controls.getObject().position;

                // Multi-floor and stairway collision checking
                let currentFloorHeight = 0;

                // Check second floor platform collision
                if (playerPos.y >= 18) {
                    const inLeftWing = playerPos.x <= -30;
                    const inRightWing = playerPos.x >= 30;
                    const inFrontWing = playerPos.z >= 20;
                    const inBackWing = playerPos.z <= -80;

                    if (inLeftWing || inRightWing || inFrontWing || inBackWing) {
                        currentFloorHeight = 20;
                    }
                }

                // Stair ramp detection
                if (playerPos.z <= -25 && playerPos.z >= -65 && Math.abs(playerPos.x) <= 40) {
                    const stairProgress = Math.min(1.0, Math.max(0.0, (-25 - playerPos.z) / 40));
                    currentFloorHeight = stairProgress * 20;
                }

                // Snap height to floor level
                if (playerPos.y < currentFloorHeight + CONFIG.playerHeight) {
                    velocity.y = 0;
                    playerPos.y = currentFloorHeight + CONFIG.playerHeight;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        // ===================================================================
        // 8. ENTRY POINT
        // ===================================================================
        window.onload = () => {
            initEngine();
            animate();
        };
    </script>
</body>
</html>
