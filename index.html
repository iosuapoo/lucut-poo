<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ultimate Farm & Tractor Logistics Simulator</title>
    <style>
        :root {
            --bg-color: #111827;
            --panel-bg: #1f2937;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-gold: #fbbf24;
            --text-light: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: var(--accent-gold);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        #game-layout {
            display: flex;
            gap: 15px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 1150px;
            width: 100%;
        }

        #canvas-wrapper {
            position: relative;
            flex: 1;
        }

        canvas {
            border: 3px solid var(--accent-green);
            border-radius: 8px;
            display: block;
            width: 100%;
            height: 520px;
        }

        #sidebar {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .card {
            background-color: #111827;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-orange);
        }

        .card.gold-card {
            border-left-color: var(--accent-gold);
        }

        .card h3 {
            margin: 0 0 8px 0;
            color: #f59e0b;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .grid-store {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .store-item {
            background: #1f2937;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .store-item.top-tier {
            border: 1px solid var(--accent-gold);
            background: #371b04;
        }

        .npc-card {
            background: #374151;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        .npc-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        button {
            padding: 5px 8px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #059669;
        }

        button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }

        .vehicle-selector {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .vehicle-btn {
            flex: 1;
            font-size: 11px;
            padding: 5px;
        }

        .audio-btn {
            background-color: #ef4444;
            font-size: 11px;
            padding: 3px 6px;
        }

        .audio-btn.enabled {
            background-color: #10b981;
        }

        #controls-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
    </style>
    <!-- Load Three.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>3D Farm Logistics & Empire Simulator</h1>

    <div id="game-layout">
        <div id="canvas-wrapper">
            <div id="3d-container"></div>
            <div id="controls-hint">Controls: WASD or Arrow Keys to Drive</div>
        </div>

        <div id="sidebar">
            <div class="card gold-card">
                <h3>
                    Treasury
                    <button id="audio-toggle" class="audio-btn" onclick="toggleAudio()">Sound: OFF</button>
                </h3>
                <div class="stat-group"><span>Coins:</span> <strong id="money-val" style="color: var(--accent-gold); font-size: 15px;">100</strong></div>
                <div class="stat-group"><span>Reputation:</span> <span id="rep-val">0</span></div>
            </div>

            <div class="card">
                <h3>Vehicle Config</h3>
                <div class="stat-group"><span>Model:</span> <span id="vehicle-type">Utility Tractor</span></div>
                <div class="stat-group"><span>Top Speed:</span> <span id="vehicle-speed">0.3</span></div>
                <div class="vehicle-selector">
                    <button class="vehicle-btn" onclick="setVehicle('utility')">Utility</button>
                    <button class="vehicle-btn" onclick="setVehicle('heavy')">Heavy Duty</button>
                    <button class="vehicle-btn" onclick="setVehicle('harvest')">Harvester</button>
                </div>
            </div>

            <div class="card">
                <h3>Produce Market</h3>
                <div id="store-grid" class="grid-store"></div>
            </div>

            <div class="card">
                <h3>Town Delivery Orders</h3>
                <div id="npc-list"></div>
            </div>
        </div>
    </div>

    <script>
        // =================================================================
        // AUDIO ENGINE (WEB AUDIO API)
        // =================================================================
        let audioCtx = null;
        let audioEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-toggle');
            if (audioEnabled) {
                btn.innerText = "Sound: ON";
                btn.classList.add('enabled');
                playTone(440, 'sine', 0.1, 0.1);
            } else {
                btn.innerText = "Sound: OFF";
                btn.classList.remove('enabled');
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playEngineSound() {
            if (Math.random() < 0.2) {
                playTone(50 + Math.random() * 20, 'sawtooth', 0.04, 0.02);
            }
        }

        function playTradeSound() {
            if (!audioEnabled) return;
            playTone(523.25, 'sine', 0.1, 0.15);
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.15), 80);
            setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 160);
        }

        // =================================================================
        // GAME DATA & CROPS
        // =================================================================
        const CROPS = {
            CARROT: { name: 'Carrot', icon: '🥕', cost: 10, sellReward: 25 },
            POTATO: { name: 'Potato', icon: '🥔', cost: 15, sellReward: 35 },
            TOMATO: { name: 'Tomato', icon: '🍅', cost: 25, sellReward: 55 },
            CORN: { name: 'Corn', icon: '🌽', cost: 40, sellReward: 90 },
            BROCCOLI: { name: 'Broccoli', icon: '🥦', cost: 75, sellReward: 160 },
            WATERMELON: { name: 'Watermelon', icon: '🍉', cost: 150, sellReward: 320 },
            PUMPKIN: { name: 'Pumpkin', icon: '🎃', cost: 300, sellReward: 650 },
            GRAPES: { name: 'Grapes', icon: '🍇', cost: 600, sellReward: 1300 },
            DRAGONFRUIT: { name: 'Dragonfruit', icon: '🐉', cost: 1500, sellReward: 3200 },
            GOLDEN_APPLE: { name: 'Golden Apple', icon: '🍎', cost: 5000, sellReward: 12000, topTier: true }
        };

        const VEHICLES = {
            utility: { name: 'Utility Tractor', speed: 0.35, turnSpeed: 0.04, color: 0xc0392b },
            heavy: { name: 'Heavy Duty', speed: 0.25, turnSpeed: 0.03, color: 0x27ae60 },
            harvest: { name: 'Combine Harvester', speed: 0.42, turnSpeed: 0.05, color: 0xf39c12 }
        };

        const state = {
            money: 100,
            reputation: 0,
            currentVehicle: 'utility',
            inventory: { 'Carrot': 3, 'Potato': 2, 'Golden Apple': 0 }
        };

        Object.keys(CROPS).forEach(k => {
            const name = CROPS[k].name;
            if (state.inventory[name] === undefined) state.inventory[name] = 0;
        });

        const npcs = [
            { id: 1, name: 'Chef Mario', x: 25, z: -25, itemNeeded: 'Carrot', mesh: null },
            { id: 2, name: 'Grocer Sarah', x: 30, z: 0, itemNeeded: 'Potato', mesh: null },
            { id: 3, name: 'Mayor Gold', x: 20, z: 25, itemNeeded: 'Golden Apple', mesh: null }
        ];

        function getRandomCropName() {
            const keys = Object.keys(CROPS);
            let chosen = CROPS[keys[Math.floor(Math.random() * keys.length)]].name;
            if (chosen === 'Golden Apple' && Math.random() > 0.15) chosen = CROPS.CARROT.name;
            return chosen;
        }

        // =================================================================
        // THREE.JS 3D SCENE SETUP
        // =================================================================
        const container = document.getElementById('canvas-wrapper');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(45, 650 / 520, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(650, 520);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -60;
        scene.add(dirLight);

        // Ground Plane (Farm Field)
        const groundGeo = new THREE.PlaneGeometry(120, 120);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x558b2f, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Farm Field Stripes
        for (let i = -50; i < 50; i += 8) {
            const stripeGeo = new THREE.PlaneGeometry(2, 100);
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(i, 0.01, 0);
            stripe.receiveShadow = true;
            scene.add(stripe);
        }

        // =================================================================
        // 3D MODELS CREATION (BUILDING WITH PRIMITIVES)
        // =================================================================
        // Tractor Mesh Container
        const tractorGroup = new THREE.Group();
        scene.add(tractorGroup);

        let tractorBodyMesh;

        function buildTractorMesh(colorHex) {
            // Clear existing children
            while(tractorGroup.children.length > 0){ 
                tractorGroup.remove(tractorGroup.children[0]); 
            }

            // Chassis
            const bodyGeo = new THREE.BoxGeometry(2, 1.2, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
            tractorBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            tractorBodyMesh.position.y = 1;
            tractorBodyMesh.castShadow = true;
            tractorGroup.add(tractorBodyMesh);

            // Cabin
            const cabGeo = new THREE.BoxGeometry(1.8, 1.2, 1.4);
            const cabMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const cab = new THREE.Mesh(cabGeo, cabMat);
            cab.position.set(0, 1.8, -0.5);
            cab.castShadow = true;
            tractorGroup.add(cab);

            // Windows
            const winGeo = new THREE.BoxGeometry(1.82, 0.8, 1.2);
            const winMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.1 });
            const win = new THREE.Mesh(winGeo, winMat);
            win.position.set(0, 1.9, -0.5);
            tractorGroup.add(win);

            // Exhaust Stack
            const exGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.2);
            const exMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            const exhaust = new THREE.Mesh(exGeo, exMat);
            exhaust.position.set(0.6, 2.0, 1.0);
            tractorGroup.add(exhaust);

            // Big Rear Wheels
            const rWheelGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.5, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            
            const rWheelL = new THREE.Mesh(rWheelGeo, wheelMat);
            rWheelL.rotation.z = Math.PI / 2;
            rWheelL.position.set(1.2, 0.9, -0.8);
            rWheelL.castShadow = true;
            tractorGroup.add(rWheelL);

            const rWheelR = rWheelL.clone();
            rWheelR.position.x = -1.2;
            tractorGroup.add(rWheelR);

            // Small Front Wheels
            const fWheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            const fWheelL = new THREE.Mesh(fWheelGeo, wheelMat);
            fWheelL.rotation.z = Math.PI / 2;
            fWheelL.position.set(1.1, 0.5, 1.0);
            fWheelL.castShadow = true;
            tractorGroup.add(fWheelL);

            const fWheelR = fWheelL.clone();
            fWheelR.position.x = -1.1;
            tractorGroup.add(fWheelR);
        }

        buildTractorMesh(VEHICLES.utility.color);

        // Build Town Order Delivery Zones (NPC Markers)
        npcs.forEach(npc => {
            const group = new THREE.Group();
            group.position.set(npc.x, 0, npc.z);

            // Building Pad
            const padGeo = new THREE.CylinderGeometry(4, 4, 0.2, 32);
            const padMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.receiveShadow = true;
            group.add(pad);

            // NPC House/Stall
            const houseGeo = new THREE.BoxGeometry(3, 3, 3);
            const houseMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af });
            const house = new THREE.Mesh(houseGeo, houseMat);
            house.position.y = 1.5;
            house.castShadow = true;
            group.add(house);

            // Roof
            const roofGeo = new THREE.ConeGeometry(2.5, 1.5, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 3.75;
            roof.rotation.y = Math.PI / 4;
            group.add(roof);

            scene.add(group);
            npc.mesh = group;
        });

        // Add visual trees around perimeter
        for (let i = 0; i < 20; i++) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 2),
                new THREE.MeshStandardMaterial({ color: 0x5c4033 })
            );
            trunk.position.y = 1;
            treeGroup.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(1.8, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x15803d })
            );
            leaves.position.y = 3;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            const angle = (i / 20) * Math.PI * 2;
            treeGroup.position.set(Math.cos(angle) * 55, 0, Math.sin(angle) * 55);
            scene.add(treeGroup);
        }

        // =================================================================
        // CONTROLS & MOVEMENT
        // =================================================================
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function updatePhysics() {
            const vehicle = VEHICLES[state.currentVehicle];
            let isMoving = false;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                tractorGroup.translateZ(vehicle.speed);
                isMoving = true;
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                tractorGroup.translateZ(-vehicle.speed * 0.5);
                isMoving = true;
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                tractorGroup.rotation.y += vehicle.turnSpeed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                tractorGroup.rotation.y -= vehicle.turnSpeed;
            }

            // Clamp positions to field
            tractorGroup.position.x = Math.max(-50, Math.min(50, tractorGroup.position.x));
            tractorGroup.position.z = Math.max(-50, Math.min(50, tractorGroup.position.z));

            if (isMoving) playEngineSound();

            // Smooth Camera Follow
            const targetCamPos = new THREE.Vector3();
            targetCamPos.x = tractorGroup.position.x - Math.sin(tractorGroup.rotation.y) * 18;
            targetCamPos.z = tractorGroup.position.z - Math.cos(tractorGroup.rotation.y) * 18;
            targetCamPos.y = tractorGroup.position.y + 12;

            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(tractorGroup.position.x, tractorGroup.position.y + 1, tractorGroup.position.z);
        }

        // =================================================================
        // UI INTERACTION
        // =================================================================
        function buyCrop(cropKey) {
            const crop = CROPS[cropKey];
            if (state.money >= crop.cost) {
                state.money -= crop.cost;
                state.inventory[crop.name] = (state.inventory[crop.name] || 0) + 1;
                playTone(600, 'sine', 0.08, 0.1);
                updateUI();
            } else {
                playTone(150, 'sawtooth', 0.2, 0.1);
            }
        }

        function setVehicle(type) {
            if (VEHICLES[type]) {
                state.currentVehicle = type;
                buildTractorMesh(VEHICLES[type].color);
                document.getElementById('vehicle-type').innerText = VEHICLES[type].name;
                document.getElementById('vehicle-speed').innerText = VEHICLES[type].speed;
                playTone(300, 'square', 0.05, 0.1);
            }
        }

        function updateUI() {
            document.getElementById('money-val').innerText = state.money.toLocaleString();
            document.getElementById('rep-val').innerText = state.reputation;

            // Render Store Grid
            const storeGrid = document.getElementById('store-grid');
            storeGrid.innerHTML = '';

            Object.keys(CROPS).forEach(k => {
                const crop = CROPS[k];
                const owned = state.inventory[crop.name] || 0;
                const itemDiv = document.createElement('div');
                itemDiv.className = `store-item ${crop.topTier ? 'top-tier' : ''}`;
                itemDiv.innerHTML = `
                    <div><strong>${crop.icon} ${crop.name}</strong></div>
                    <div style="color: #f59e0b;">Cost: ${crop.cost}g</div>
                    <div>Owned: <strong>${owned}</strong></div>
                    <button style="margin-top:4px;" onclick="buyCrop('${k}')">Buy 1</button>
                `;
                storeGrid.appendChild(itemDiv);
            });

            // Render NPC Orders
            const npcContainer = document.getElementById('npc-list');
            npcContainer.innerHTML = '';
            npcs.forEach(npc => {
                const dist = Math.hypot(tractorGroup.position.x - npc.x, tractorGroup.position.z - npc.z);
                const inRange = dist < 8;
                const cropObj = Object.values(CROPS).find(c => c.name === npc.itemNeeded);
                const reward = cropObj ? cropObj.sellReward : 50;

                const card = document.createElement('div');
                card.className = 'npc-card';
                card.innerHTML = `
                    <div class="npc-header">
                        <span>${npc.name}</span>
                        <span style="color: #f59e0b;">+${reward} coins</span>
                    </div>
                    <div>Wants: <strong>${cropObj ? cropObj.icon : ''} ${npc.itemNeeded}</strong></div>
                    <button ${!inRange ? 'disabled' : ''} onclick="fulfillTrade(${npc.id})">
                        ${inRange ? 'Deliver Cargo' : 'Drive to Zone'}
                    </button>
                `;
                npcContainer.appendChild(card);
            });
        }

        function fulfillTrade(npcId) {
            const npc = npcs.find(n => n.id === npcId);
            if (!npc) return;

            const neededItem = npc.itemNeeded;
            const cropObj = Object.values(CROPS).find(c => c.name === neededItem);
            const reward = cropObj ? cropObj.sellReward : 50;

            if (state.inventory[neededItem] && state.inventory[neededItem] > 0) {
                state.inventory[neededItem]--;
                state.money += reward;
                state.reputation += (neededItem === 'Golden Apple' ? 100 : 10);

                playTradeSound();

                npc.itemNeeded = getRandomCropName();
                updateUI();
            } else {
                playTone(150, 'sawtooth', 0.2, 0.1);
                alert(`You need to buy ${neededItem} first!`);
            }
        }

        // =================================================================
        // ANIMATION LOOP
        // =================================================================
        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();
            
            // Rotate NPC roof elements for visual feedback
            npcs.forEach(npc => {
                if (npc.mesh) npc.mesh.children[2].rotation.y += 0.02;
            });

            renderer.render(scene, camera);
            updateUI();
        }

        updateUI();
        animate();
    </script>
</body>
</html>
