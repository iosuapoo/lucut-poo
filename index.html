<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnished Mansion 3D — Sight Chase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0f0f0;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 3px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #interaction-prompt {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: none;
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.4);
        }
        #monster-proximity-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,0,85,0.8), 0 4px 10px #000;
            display: none;
            pointer-events: none;
            z-index: 50;
            letter-spacing: 2px;
        }
        #jumpscare-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(150, 0, 0, 0.9);
            color: #ffffff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-family: sans-serif;
            text-align: center;
        }
        #jumpscare-overlay h2 {
            font-size: 4rem;
            color: #ff2222;
            text-shadow: 0 0 20px #000;
            margin-bottom: 20px;
        }
        #jumpscare-overlay button {
            padding: 12px 28px;
            font-size: 1.2rem;
            background: #ff2222;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="interaction-prompt">Press E to Open/Close</div>
    <div id="monster-proximity-text">IN MY BUM</div>
    <div id="ui-layer">
        <div class="hud-card">
            <h1>Noclip Mansion — Look to Activate</h1>
            <p><strong>WASD / Arrows</strong> — Move through walls</p>
            <p><strong>Shift</strong> — Sprint (Same speed as monster)</p>
            <p><strong>Space</strong> — Jump</p>
            <p><strong>E</strong> — Open / Close Drawers</p>
            <p><strong>Look At Monster</strong> — Triggers chase</p>
        </div>
    </div>
    <div id="jumpscare-overlay">
        <h2>YOU WERE CAUGHT!</h2>
        <button onclick="restartGame()">Try Again</button>
    </div>
    <div id="canvas-container"></div>

    <script>
        const CONFIG = {
            fov: 75,
            near: 0.1,
            far: 400,
            playerHeight: 2.1,
            walkSpeed: 10.0,
            runSpeed: 18.0,
            monsterWalkSpeed: 13.5,
            monsterRunSpeed: 18.0,
            jumpForce: 9.0,
            gravity: 24.0
        };

        let scene;
        let camera;
        let renderer;
        let controls;
        let clock = new THREE.Clock();

        let moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            sprint: false,
            jump: false
        };

        let velocity = new THREE.Vector3();
        let canJump = false;
        let flickeringLights = [];

        // Interactive Objects
        let interactiveObjects = [];
        let raycaster = new THREE.Raycaster();
        let currentTarget = null;

        // Monster variables
        let monsterSprite;
        let monsterPosition = new THREE.Vector3(40, 2.1, 40);
        let monsterActivated = false;
        let gameOver = false;
        let frustum = new THREE.Frustum();
        let cameraMatrix = new THREE.Matrix4();
        let speechCooldown = 0;

        function createMonsterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 512, 512);

            ctx.fillStyle = '#2f2826';
            ctx.beginPath();
            ctx.ellipse(256, 256, 180, 230, 0, 0, Math.PI * 2);
            ctx.fill();

            const gradHead = ctx.createLinearGradient(256, 30, 256, 480);
            gradHead.addColorStop(0, '#594d48');
            gradHead.addColorStop(0.5, '#2f2826');
            gradHead.addColorStop(1, '#1a1412');
            ctx.fillStyle = gradHead;
            ctx.beginPath();
            ctx.ellipse(256, 256, 175, 225, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(180, 160, 35, 20, 0, 0, Math.PI * 2);
            ctx.ellipse(332, 160, 35, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.arc(180, 160, 12, 0, Math.PI * 2);
            ctx.arc(332, 160, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#5c1e21';
            ctx.beginPath();
            ctx.ellipse(256, 330, 100, 130, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#050202';
            ctx.beginPath();
            ctx.ellipse(256, 330, 65, 95, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#3d1214';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.ellipse(256, 330, 85, 115, 0, 0, Math.PI * 2);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        const TextureFactory = {
            createSolidWood: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2b1704';
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#3a1f06';
                ctx.fillRect(0, 0, 62, 62);
                ctx.fillRect(64, 64, 62, 62);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },
            createSolidWall: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1c0c10';
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#3d1c24';
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, 128, 128);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },
            createSolidMarble: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#dcdcdc';
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }
        };

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.012);
            
            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, CONFIG.near, CONFIG.far);
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.addEventListener('click', () => {
                if(!gameOver) controls.lock();
            });

            setupInputs();
            buildOptimizedMansion();
            setupMonster();
            setupLights();
            window.addEventListener('resize', onWindowResize);
        }

        function setupInputs() {
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = true; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = true; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = true; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = true; break;
                    case 'Space':
                        if (canJump) velocity.y += CONFIG.jumpForce;
                        canJump = false;
                        break;
                    case 'KeyE':
                        interactWithObject();
                        break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = false; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = false; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = false; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = false; break;
                }
            });
        }

        function setupMonster() {
            const monsterTex = createMonsterTexture();
            const mat = new THREE.SpriteMaterial({ map: monsterTex, transparent: true });
            monsterSprite = new THREE.Sprite(mat);
            monsterSprite.scale.set(4.5, 5.5, 1);
            monsterSprite.position.copy(monsterPosition);
            scene.add(monsterSprite);
        }

        function buildOptimizedMansion() {
            const woodTex = TextureFactory.createSolidWood();
            woodTex.repeat.set(20, 20);
            const wallTex = TextureFactory.createSolidWall();
            wallTex.repeat.set(10, 4);
            const marbleTex = TextureFactory.createSolidMarble();

            const matWood = new THREE.MeshLambertMaterial({ map: woodTex });
            const matWall = new THREE.MeshLambertMaterial({ map: wallTex });
            const matMarble = new THREE.MeshLambertMaterial({ map: marbleTex });
            
            const matTableWood = new THREE.MeshLambertMaterial({ color: 0x4a2c11 });
            const matDressers = new THREE.MeshLambertMaterial({ color: 0x3d2314 });
            const matGoldHandles = new THREE.MeshLambertMaterial({ color: 0xd4af37 });
            const matPlantLeaves = new THREE.MeshLambertMaterial({ color: 0x1e5622 });

            const wallGeometries = [];
            const floorGeometries = [];
            const staticFurnitureGeometries = [];
            const accentGeometries = [];

            const mapSize = 160;
            const wallHeight = 12;

            const groundFloor = new THREE.BoxGeometry(mapSize, 1, mapSize);
            groundFloor.translate(0, -0.5, 0);
            floorGeometries.push(groundFloor);

            const secondFloor = new THREE.BoxGeometry(mapSize, 1, mapSize);
            secondFloor.translate(0, wallHeight - 0.5, 0);
            floorGeometries.push(secondFloor);

            const ceiling = new THREE.BoxGeometry(mapSize, 1, mapSize);
            ceiling.translate(0, wallHeight * 2, 0);
            wallGeometries.push(ceiling);

            function addWall(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                geo.translate(x, y, z);
                wallGeometries.push(geo);
            }

            // Outer Walls
            addWall(mapSize, wallHeight * 2, 2, 0, wallHeight, -mapSize/2);
            addWall(mapSize, wallHeight * 2, 2, 0, wallHeight, mapSize/2);
            addWall(2, wallHeight * 2, mapSize, -mapSize/2, wallHeight, 0);
            addWall(2, wallHeight * 2, mapSize, mapSize/2, wallHeight, 0);

            const xCoords = [-60, -20, 20, 60];
            const zCoords = [-55, -25, 5, 35, 65];

            xCoords.forEach(x => {
                zCoords.forEach(z => {
                    addWall(24, wallHeight, 1.5, x, wallHeight/2, z);
                    addWall(1.5, wallHeight, 24, x - 12, wallHeight/2, z);
                    
                    addWall(24, wallHeight, 1.5, x, wallHeight + wallHeight/2, z);
                    addWall(1.5, wallHeight, 24, x - 12, wallHeight + wallHeight/2, z);
                });
            });

            function addTable(x, y, z, width, depth, height) {
                const top = new THREE.BoxGeometry(width, 0.2, depth);
                top.translate(x, y + height, z);
                staticFurnitureGeometries.push(top);

                const legW = 0.2;
                const legH = height;
                const legPositions = [
                    [x - width/2 + 0.2, y + legH/2, z - depth/2 + 0.2],
                    [x + width/2 - 0.2, y + legH/2, z - depth/2 + 0.2],
                    [x - width/2 + 0.2, y + legH/2, z + depth/2 - 0.2],
                    [x + width/2 - 0.2, y + legH/2, z + depth/2 - 0.2]
                ];

                legPositions.forEach(pos => {
                    const leg = new THREE.BoxGeometry(legW, legH, legW);
                    leg.translate(pos[0], pos[1], pos[2]);
                    staticFurnitureGeometries.push(leg);
                });
            }

            function addInteractiveDresser(x, y, z, width, depth, height, drawersCount) {
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), matDressers);
                bodyMesh.position.set(x, y + height/2, z);
                scene.add(bodyMesh);

                const drawerH = (height - 0.2) / drawersCount;

                for (let i = 0; i < drawersCount; i++) {
                    const drawerGroup = new THREE.Group();
                    const dY = y + 0.1 + (i * drawerH) + (drawerH / 2);

                    const drawerBox = new THREE.Mesh(new THREE.BoxGeometry(width - 0.2, drawerH - 0.05, depth - 0.1), matDressers);
                    drawerBox.position.set(0, 0, 0);
                    drawerGroup.add(drawerBox);

                    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.1), matGoldHandles);
                    handle.position.set(0, 0, depth/2 + 0.05);
                    drawerGroup.add(handle);

                    drawerGroup.position.set(x, dY, z);
                    scene.add(drawerGroup);

                    drawerGroup.userData = {
                        isOpen: false,
                        originalZ: z,
                        openZ: z + (depth * 0.7),
                        type: 'drawer'
                    };

                    handle.userData.parentGroup = drawerGroup;
                    interactiveObjects.push(handle);
                }
            }

            function addPottedPlant(x, y, z) {
                const pot = new THREE.CylinderGeometry(0.6, 0.4, 1.2, 8);
                pot.translate(x, y + 0.6, z);
                staticFurnitureGeometries.push(pot);

                const bush = new THREE.SphereGeometry(1.0, 8, 8);
                bush.translate(x, y + 1.8, z);
                accentGeometries.push(bush);
            }

            const roomCenters = [];
            xCoords.forEach(x => {
                zCoords.forEach(z => {
                    roomCenters.push({x: x, z: z, y: 0});
                    roomCenters.push({x: x, z: z, y: wallHeight});
                });
            });

            roomCenters.forEach((room) => {
                addTable(room.x, room.y, room.z, 3.5, 2.5, 1.2);
                addInteractiveDresser(room.x, room.y, room.z - 5, 4.0, 1.8, 1.4, 3);
                addPottedPlant(room.x - 5, room.y, room.z - 5);
            });

            const mergedWalls = THREE.BufferGeometryUtils.mergeBufferGeometries(wallGeometries);
            scene.add(new THREE.Mesh(mergedWalls, matWall));

            const mergedFloors = THREE.BufferGeometryUtils.mergeBufferGeometries(floorGeometries);
            scene.add(new THREE.Mesh(mergedFloors, matWood));

            const mergedFurniture = THREE.BufferGeometryUtils.mergeBufferGeometries(staticFurnitureGeometries);
            scene.add(new THREE.Mesh(mergedFurniture, matTableWood));

            const mergedAccents = THREE.BufferGeometryUtils.mergeBufferGeometries(accentGeometries);
            scene.add(new THREE.Mesh(mergedAccents, matPlantLeaves));

            const stairGeometries = [];
            const stepsCount = 12;
            for (let i = 0; i < stepsCount; i++) {
                const step = new THREE.BoxGeometry(16, 1.0, 1.5);
                step.translate(0, 0.5 + i, -10.0 - (i * 1.5));
                stairGeometries.push(step);
            }
            const mergedStairs = THREE.BufferGeometryUtils.mergeBufferGeometries(stairGeometries);
            scene.add(new THREE.Mesh(mergedStairs, matMarble));
        }

        function createPointLightInstance(x, y, z, color, intensity, distance) {
            const light = new THREE.PointLight(color, intensity, distance);
            light.position.set(x, y, z);
            scene.add(light);
            flickeringLights.push({
                light: light,
                baseIntensity: intensity,
                speed: 10 + Math.random() * 20
            });
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.45);
            scene.add(ambient);

            const xCoords = [-60, -20, 20, 60];
            const zCoords = [-55, -25, 5, 35, 65];

            xCoords.forEach(x => {
                zCoords.forEach(z => {
                    createPointLightInstance(x, 10, z, 0xffaa44, 1.2, 40);
                    createPointLightInstance(x, 22, z, 0xffaa44, 1.2, 40);
                });
            });
        }

        function animateFlicker(time) {
            for (let i = 0; i < flickeringLights.length; i++) {
                const item = flickeringLights[i];
                const noise = Math.sin(time * item.speed);
                if (Math.random() > 0.96) {
                    item.light.intensity = item.baseIntensity * 0.1;
                } else {
                    item.light.intensity = item.baseIntensity + (noise * 0.2);
                }
            }
        }

        function isMonsterVisibleToCamera() {
            camera.updateMatrixWorld();
            camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
            cameraMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(cameraMatrix);

            return frustum.containsPoint(monsterSprite.position);
        }

        function speakPhrase() {
            if ('speechSynthesis' in window && performance.now() - speechCooldown > 1200) {
                const utterance = new SpeechSynthesisUtterance("in my bum");
                utterance.pitch = 0.5;
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
                speechCooldown = performance.now();
            }
        }

        function updateMonsterAI(delta) {
            if (gameOver || !controls.isLocked) return;

            // Check if monster should activate via line-of-sight view
            if (!monsterActivated && isMonsterVisibleToCamera()) {
                monsterActivated = true;
            }

            if (!monsterActivated) return;

            const playerPos = controls.getObject().position;
            const dir = new THREE.Vector3().subVectors(playerPos, monsterSprite.position);
            const dist = dir.length();
            dir.normalize();

            // Movement speeds
            const isPlayerSprinting = moveState.sprint && (moveState.forward || moveState.backward || moveState.left || moveState.right);
            const monsterSpeed = isPlayerSprinting ? CONFIG.monsterRunSpeed : CONFIG.monsterWalkSpeed;

            // Move straight through walls/obstacles towards player
            monsterSprite.position.addScaledVector(dir, monsterSpeed * delta);

            // Proximity phrase trigger when close
            const proximityEl = document.getElementById('monster-proximity-text');
            if (dist < 12.0) {
                proximityEl.style.display = 'block';
                speakPhrase();
            } else {
                proximityEl.style.display = 'none';
            }

            // Jumpscare collision
            if (dist < 1.8) {
                triggerJumpscare();
            }
        }

        function triggerJumpscare() {
            gameOver = true;
            controls.unlock();
            document.getElementById('monster-proximity-text').style.display = 'none';
            document.getElementById('jumpscare-overlay').style.display = 'flex';
        }

        function restartGame() {
            gameOver = false;
            monsterActivated = false;
            document.getElementById('jumpscare-overlay').style.display = 'none';
            document.getElementById('monster-proximity-text').style.display = 'none';
            controls.getObject().position.set(0, CONFIG.playerHeight, 0);
            monsterSprite.position.set(40, CONFIG.playerHeight, 40);
            controls.lock();
        }

        function checkInteractions() {
            if (!controls.isLocked || gameOver) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            const promptEl = document.getElementById('interaction-prompt');

            if (intersects.length > 0 && intersects[0].distance < 6.0) {
                currentTarget = intersects[0].object.userData.parentGroup;
                promptEl.style.display = 'block';
                promptEl.innerText = currentTarget.userData.isOpen ? "Press E to Close Drawer" : "Press E to Open Drawer";
            } else {
                currentTarget = null;
                promptEl.style.display = 'none';
            }
        }

        function interactWithObject() {
            if (currentTarget && !gameOver) {
                const group = currentTarget;
                group.userData.isOpen = !group.userData.isOpen;
                
                const targetZ = group.userData.isOpen ? group.userData.openZ : group.userData.originalZ;
                
                const startZ = group.position.z;
                const startTime = performance.now();
                const duration = 250;

                function animateMove(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1.0);
                    group.position.z = THREE.MathUtils.lerp(startZ, targetZ, progress);

                    if (progress < 1.0) {
                        requestAnimationFrame(animateMove);
                    }
                }
                requestAnimationFrame(animateMove);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            animateFlicker(elapsedTime);
            checkInteractions();
            updateMonsterAI(delta);

            if (controls.isLocked && !gameOver) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= CONFIG.gravity * delta;

                const speed = moveState.sprint ? CONFIG.runSpeed : CONFIG.walkSpeed;

                const moveVector = new THREE.Vector3();
                if (moveState.forward) moveVector.z += 1;
                if (moveState.backward) moveVector.z -= 1;
                if (moveState.left) moveVector.x -= 1;
                if (moveState.right) moveVector.x += 1;
                moveVector.normalize();

                if (moveState.forward || moveState.backward) velocity.z += moveVector.z * speed * 10.0 * delta;
                if (moveState.left || moveState.right) velocity.x += moveVector.x * speed * 10.0 * delta;

                // Move directly through walls without collision checks
                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);

                controls.getObject().position.y += (velocity.y * delta);
                const playerPos = controls.getObject().position;

                let currentFloorHeight = 0;

                if (playerPos.z <= -10 && playerPos.z >= -28 && Math.abs(playerPos.x) <= 10) {
                    const stairProgress = Math.min(1.0, Math.max(0.0, (-10 - playerPos.z) / 18));
                    currentFloorHeight = stairProgress * 12;
                } else if (playerPos.y >= 10) {
                    currentFloorHeight = 12;
                }

                if (playerPos.y < currentFloorHeight + CONFIG.playerHeight) {
                    velocity.y = 0;
                    playerPos.y = currentFloorHeight + CONFIG.playerHeight;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initEngine();
            animate();
        };
    </script>
</body>
</html>
