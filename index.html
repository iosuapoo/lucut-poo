<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tractor & Economy Simulator</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --panel-bg: #2c3e50;
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --text-light: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        #game-layout {
            display: flex;
            gap: 20px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #canvas-wrapper {
            position: relative;
        }

        canvas {
            border: 4px solid var(--accent-green);
            border-radius: 8px;
            background-color: #558b2f;
            display: block;
        }

        #sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .card {
            background-color: #1a252f;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-orange);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #f39c12;
            font-size: 16px;
        }

        .stat-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .npc-card {
            background: #34495e;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .npc-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        button {
            padding: 8px 12px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2ecc71;
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        .vehicle-selector {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .vehicle-btn {
            flex: 1;
            font-size: 11px;
            padding: 5px;
        }

        .controls-hint {
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Farm Logistics & Tractor Engine</h1>

    <div id="game-layout">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="700" height="500"></canvas>
        </div>

        <div id="sidebar">
            <div class="card">
                <h3>Farm Statistics</h3>
                <div class="stat-group"><span>Money:</span> <span id="money-val">$100</span></div>
                <div class="stat-group"><span>Reputation:</span> <span id="rep-val">0</span></div>
            </div>

            <div class="card">
                <h3>Vehicle Config</h3>
                <div class="stat-group"><span>Type:</span> <span id="vehicle-type">Utility Tractor</span></div>
                <div class="stat-group"><span>Speed:</span> <span id="vehicle-speed">3.0</span></div>
                <div class="vehicle-selector">
                    <button class="vehicle-btn" onclick="setVehicle('utility')">Utility</button>
                    <button class="vehicle-btn" onclick="setVehicle('heavy')">Heavy Duty</button>
                    <button class="vehicle-btn" onclick="setVehicle('vintage')">Vintage</button>
                </div>
            </div>

            <div class="card">
                <h3>Inventory</h3>
                <div id="inventory-list"></div>
            </div>

            <div class="card">
                <h3>Town Requests</h3>
                <div id="npc-list"></div>
            </div>
        </div>
    </div>

    <script>
        // =================================================================
        // DATA STRUCTURES & CONFIGURATION
        // =================================================================
        const ITEMS = {
            WHEAT: { name: 'Wheat', color: '#f1c40f', basePrice: 15 },
            CORN: { name: 'Corn', color: '#e67e22', basePrice: 20 },
            FERTILIZER: { name: 'Fertilizer', color: '#8e44ad', basePrice: 35 },
            TOOLS: { name: 'Tools', color: '#7f8c8d', basePrice: 50 },
            FUEL: { name: 'Fuel', color: '#e74c3c', basePrice: 40 }
        };

        const VEHICLES = {
            utility: { name: 'Utility Tractor', speed: 3.2, color: '#c0392b', rearWheelR: 16, frontWheelR: 8, bodyLength: 36 },
            heavy: { name: 'Heavy Duty', speed: 2.4, color: '#27ae60', rearWheelR: 22, frontWheelR: 11, bodyLength: 46 },
            vintage: { name: 'Vintage Row-Crop', speed: 3.8, color: '#d35400', rearWheelR: 18, frontWheelR: 6, bodyLength: 32 }
        };

        const state = {
            money: 100,
            reputation: 0,
            currentVehicle: 'utility',
            inventory: {
                Wheat: 5,
                Corn: 3,
                Fertilizer: 2,
                Tools: 1,
                Fuel: 2
            }
        };

        // =================================================================
        // TRACTOR OBJECT & PHYSICS
        // =================================================================
        const tractor = {
            x: 150,
            y: 250,
            angle: 0,
            vx: 0,
            vy: 0,
            steering: 0,
            enginePower: 0,
            exhaustParticles: []
        };

        // =================================================================
        // NPC DATA & AI
        // =================================================================
        const npcs = [
            { id: 1, name: 'Farmer Bob', x: 550, y: 100, itemNeeded: 'Fertilizer', reward: 50 },
            { id: 2, name: 'Trader Alice', x: 600, y: 280, itemNeeded: 'Wheat', reward: 25 },
            { id: 3, name: 'Mechanic Dave', x: 520, y: 420, itemNeeded: 'Tools', reward: 75 },
            { id: 4, name: 'Rancher Emily', x: 180, y: 410, itemNeeded: 'Corn', reward: 30 }
        ];

        // =================================================================
        // PARTICLE SYSTEM (EXHAUST SMOKE)
        // =================================================================
        function createExhaustParticle(x, y) {
            return {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1.2 - 0.5,
                size: Math.random() * 4 + 2,
                alpha: 0.6,
                life: 1.0
            };
        }

        function updateParticles() {
            for (let i = tractor.exhaustParticles.length - 1; i >= 0; i--) {
                const p = tractor.exhaustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.size += 0.15;
                p.alpha -= 0.02;
                p.life -= 0.02;

                if (p.life <= 0) {
                    tractor.exhaustParticles.splice(i, 1);
                }
            }
        }

        function drawParticles(ctx) {
            ctx.save();
            tractor.exhaustParticles.forEach(p => {
                ctx.fillStyle = `rgba(100, 100, 100, ${Math.max(0, p.alpha)})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // =================================================================
        // INPUT HANDLING
        // =================================================================
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function processInput() {
            const spec = VEHICLES[state.currentVehicle];
            const moveSpeed = spec.speed;

            let isMoving = false;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                tractor.y -= moveSpeed;
                tractor.angle = -Math.PI / 2;
                isMoving = true;
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                tractor.y += moveSpeed;
                tractor.angle = Math.PI / 2;
                isMoving = true;
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                tractor.x -= moveSpeed;
                tractor.angle = Math.PI;
                isMoving = true;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                tractor.x += moveSpeed;
                tractor.angle = 0;
                isMoving = true;
            }

            // Boundaries
            tractor.x = Math.max(30, Math.min(670, tractor.x));
            tractor.y = Math.max(30, Math.min(470, tractor.y));

            // Emit particles when moving
            if (isMoving && Math.random() < 0.4) {
                tractor.exhaustParticles.push(createExhaustParticle(tractor.x - 10, tractor.y - 12));
            }
        }

        // =================================================================
        // RENDERING TRACTOR (DISTINCT FROM CAR)
        // =================================================================
        function drawTractor(ctx, x, y, spec) {
            ctx.save();
            ctx.translate(x, y);

            // 1. Large Rear Wheels
            ctx.fillStyle = '#111111';
            ctx.fillRect(-18, -spec.rearWheelR - 2, 14, spec.rearWheelR);
            ctx.fillRect(-18, 2, 14, spec.rearWheelR);

            // Tire Tread Details
            ctx.fillStyle = '#333333';
            for (let i = -spec.rearWheelR - 2; i < 0; i += 4) {
                ctx.fillRect(-18, i, 14, 2);
            }
            for (let i = 2; i < spec.rearWheelR + 2; i += 4) {
                ctx.fillRect(-18, i, 14, 2);
            }

            // 2. Small Front Wheels
            ctx.fillStyle = '#111111';
            ctx.fillRect(spec.bodyLength - 12, -spec.frontWheelR - 1, 8, spec.frontWheelR);
            ctx.fillRect(spec.bodyLength - 12, 1, 8, spec.frontWheelR);

            // 3. Main Chassis/Engine Hood
            ctx.fillStyle = spec.color;
            ctx.fillRect(-5, -10, spec.bodyLength, 20);

            // 4. Tall Rear Cab / ROPS Frame
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-12, -8, 12, 16);
            ctx.fillStyle = '#3498db'; // Glass
            ctx.fillRect(-10, -6, 8, 12);

            // 5. Vertical Exhaust Pipe Stack
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath();
            ctx.arc(spec.bodyLength - 16, -8, 3, 0, Math.PI * 2);
            ctx.fill();

            // Pipe rim
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        // =================================================================
        // ENVIRONMENT & SCENE DRAWING
        // =================================================================
        function drawEnvironment(ctx, canvas) {
            // Draw Crop Rows (Background Texture)
            ctx.strokeStyle = '#4d7c0f';
            ctx.lineWidth = 4;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Draw NPCs
            npcs.forEach(npc => {
                // Outer ring
                ctx.fillStyle = '#2980b9';
                ctx.beginPath();
                ctx.arc(npc.x, npc.y, 14, 0, Math.PI * 2);
                ctx.fill();

                // Inner core
                ctx.fillStyle = '#3498db';
                ctx.beginPath();
                ctx.arc(npc.x, npc.y, 8, 0, Math.PI * 2);
                ctx.fill();

                // Request Overhead Box
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(npc.x - 40, npc.y - 42, 80, 22);
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 1;
                ctx.strokeRect(npc.x - 40, npc.y - 42, 80, 22);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Wants: ${npc.itemNeeded}`, npc.x, npc.y - 28);
            });
        }

        // =================================================================
        // UI & INTERACTION LOGIC
        // =================================================================
        function setVehicle(type) {
            if (VEHICLES[type]) {
                state.currentVehicle = type;
                document.getElementById('vehicle-type').innerText = VEHICLES[type].name;
                document.getElementById('vehicle-speed').innerText = VEHICLES[type].speed;
            }
        }

        function updateUI() {
            document.getElementById('money-val').innerText = `$${state.money}`;
            document.getElementById('rep-val').innerText = state.reputation;

            // Render Inventory
            const invContainer = document.getElementById('inventory-list');
            invContainer.innerHTML = '';
            for (const [item, count] of Object.entries(state.inventory)) {
                const row = document.createElement('div');
                row.className = 'stat-group';
                row.innerHTML = `<span>${item}:</span> <strong>${count}</strong>`;
                invContainer.appendChild(row);
            }

            // Render NPC Trade List
            const npcContainer = document.getElementById('npc-list');
            npcContainer.innerHTML = '';
            npcs.forEach(npc => {
                const dist = Math.hypot(tractor.x - npc.x, tractor.y - npc.y);
                const inRange = dist < 70;

                const card = document.createElement('div');
                card.className = 'npc-card';
                card.innerHTML = `
                    <div class="npc-header">
                        <span>${npc.name}</span>
                        <span style="color: #f1c40f;">+$${npc.reward}</span>
                    </div>
                    <div>Needs: <strong>${npc.itemNeeded}</strong></div>
                    <button ${!inRange ? 'disabled' : ''} onclick="fulfillTrade(${npc.id})">
                        ${inRange ? 'Trade Now' : 'Drive Closer'}
                    </button>
                `;
                npcContainer.appendChild(card);
            });
        }

        function fulfillTrade(npcId) {
            const npc = npcs.find(n => n.id === npcId);
            if (!npc) return;

            const neededItem = npc.itemNeeded;

            if (state.inventory[neededItem] && state.inventory[neededItem] > 0) {
                state.inventory[neededItem]--;
                state.money += npc.reward;
                state.reputation += 10;

                // Pick a new random need
                const keys = Object.keys(ITEMS);
                const randomKey = keys[Math.floor(Math.random() * keys.length)];
                npc.itemNeeded = ITEMS[randomKey].name;
                npc.reward = ITEMS[randomKey].basePrice + Math.floor(Math.random() * 20);

                updateUI();
            } else {
                alert(`You don't have any ${neededItem} in your inventory!`);
            }
        }

        // =================================================================
        // MAIN GAME LOOP
        // =================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function loop() {
            processInput();
            updateParticles();

            // Clear & Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(ctx, canvas);
            drawParticles(ctx);
            drawTractor(ctx, tractor.x, tractor.y, VEHICLES[state.currentVehicle]);

            updateUI();
            requestAnimationFrame(loop);
        }

        // Initialize UI & Start Engine
        updateUI();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
