<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Mansion 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0f0f0;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 3px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
    <!-- Three.js and PointerLock Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui-layer">
        <div class="hud-card">
            <h1>Grand Mansion Interior</h1>
            <p><strong>WASD / Arrows</strong> — Move</p>
            <p><strong>Shift</strong> — Sprint</p>
            <p><strong>Space</strong> — Jump</p>
            <p><strong>Click Screen</strong> — Lock Mouse & Look Around</p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script>
        // ===================================================================
        // 1. ENGINE CONFIGURATION & GLOBAL STATE
        // ===================================================================
        const CONFIG = {
            fov: 75,
            near: 0.1,
            far: 1000,
            playerHeight: 2.2,
            walkSpeed: 7.0,
            runSpeed: 14.0,
            jumpForce: 9.0,
            gravity: 25.0
        };

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        let moveState = { forward: false, backward: false, left: false, right: false, sprint: false, jump: false };
        let velocity = new THREE.Vector3();
        let canJump = false;
        let pointLights = [];

        // ===================================================================
        // 2. PROCEDURAL TEXTURE GENERATOR (100% OPAQUE & HIGH DETAIL)
        // ===================================================================
        const TextureFactory = {
            createParquetWood: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2b1704';
                ctx.fillRect(0, 0, 1024, 1024);

                const plankSize = 128;
                for (let x = 0; x < 1024; x += plankSize) {
                    for (let y = 0; y < 1024; y += plankSize) {
                        const isHorizontal = ((x / plankSize) + (y / plankSize)) % 2 === 0;
                        ctx.fillStyle = isHorizontal ? '#3a1f06' : '#2d1804';
                        ctx.fillRect(x, y, plankSize - 2, plankSize - 2);

                        // Fine wood grain detail lines
                        ctx.strokeStyle = 'rgba(10, 5, 0, 0.25)';
                        ctx.lineWidth = 2;
                        const numLines = 8;
                        for (let i = 0; i < numLines; i++) {
                            ctx.beginPath();
                            if (isHorizontal) {
                                const lineY = y + (i * (plankSize / numLines));
                                ctx.moveTo(x, lineY);
                                ctx.lineTo(x + plankSize - 2, lineY);
                            } else {
                                const lineX = x + (i * (plankSize / numLines));
                                ctx.moveTo(lineX, y);
                                ctx.lineTo(lineX, y + plankSize - 2);
                            }
                            ctx.stroke();
                        }
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createDamaskWallpaper: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                
                // Deep Burgundy Base Color
                ctx.fillStyle = '#1c0c10';
                ctx.fillRect(0, 0, 1024, 1024);

                // Damask / Vertical Stripe Pattern
                ctx.fillStyle = '#2a1218';
                for (let x = 0; x < 1024; x += 128) {
                    ctx.fillRect(x + 16, 0, 96, 1024);
                }

                // Decorative Diamond Grid
                ctx.strokeStyle = '#3d1c24';
                ctx.lineWidth = 4;
                for (let x = -512; x < 1536; x += 128) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x + 1024, 1024);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x, 1024);
                    ctx.lineTo(x + 1024, 0);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createMarbleTexture: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#eaeaea';
                ctx.fillRect(0, 0, 512, 512);

                // Veining
                ctx.strokeStyle = '#9999a0';
                ctx.lineWidth = 3;
                for (let i = 0; i < 12; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 512, 0);
                    ctx.bezierCurveTo(
                        Math.random() * 512, 170, 
                        Math.random() * 512, 340, 
                        Math.random() * 512, 512
                    );
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },

            createRugTexture: function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#5c1010';
                ctx.fillRect(0, 0, 512, 512);

                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 12;
                ctx.strokeRect(20, 20, 472, 472);

                ctx.lineWidth = 4;
                ctx.strokeRect(36, 36, 440, 440);

                // Central Ornament
                ctx.fillStyle = '#d4af37';
                ctx.beginPath();
                ctx.arc(256, 256, 80, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#5c1010';
                ctx.beginPath();
                ctx.arc(256, 256, 60, 0, Math.PI * 2);
                ctx.fill();

                return new THREE.CanvasTexture(canvas);
            }
        };

        // ===================================================================
        // 3. GRAPHICS ENGINE INITIALIZATION
        // ===================================================================
        function initEngine() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.012);

            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, CONFIG.near, CONFIG.far);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.addEventListener('click', () => controls.lock());

            setupInputs();
            buildMansion();
            setupLighting();

            window.addEventListener('resize', onWindowResize);
        }

        // ===================================================================
        // 4. INPUT MANAGEMENT
        // ===================================================================
        function setupInputs() {
            const onKeyDown = (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = true; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = true; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = true; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = true; break;
                    case 'Space': if (canJump) velocity.y += CONFIG.jumpForce; canJump = false; break;
                }
            };

            const onKeyUp = (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = false; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = false; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = false; break;
                    case 'ShiftLeft': case 'ShiftRight': moveState.sprint = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        // ===================================================================
        // 5. MANSION ARCHITECTURE & GEOMETRY BUILDER
        // ===================================================================
        function buildMansion() {
            const parquetTex = TextureFactory.createParquetWood();
            parquetTex.repeat.set(12, 12);

            const wallpaperTex = TextureFactory.createDamaskWallpaper();
            wallpaperTex.repeat.set(6, 2);

            const marbleTex = TextureFactory.createMarbleTexture();
            marbleTex.repeat.set(2, 6);

            const rugTex = TextureFactory.createRugTexture();

            // Completely Opaque Materials
            const materials = {
                woodFloor: new THREE.MeshStandardMaterial({ map: parquetTex, roughness: 0.25, metalness: 0.1, opacity: 1.0, transparent: false }),
                walls: new THREE.MeshStandardMaterial({ map: wallpaperTex, roughness: 0.85, metalness: 0.05, opacity: 1.0, transparent: false }),
                marble: new THREE.MeshStandardMaterial({ map: marbleTex, roughness: 0.1, metalness: 0.1, opacity: 1.0, transparent: false }),
                gold: new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.2, opacity: 1.0, transparent: false }),
                darkWood: new THREE.MeshStandardMaterial({ color: 0x241408, roughness: 0.4, metalness: 0.1, opacity: 1.0, transparent: false }),
                fabricRed: new THREE.MeshStandardMaterial({ color: 0x660f14, roughness: 0.9, opacity: 1.0, transparent: false }),
                rug: new THREE.MeshStandardMaterial({ map: rugTex, roughness: 0.9, opacity: 1.0, transparent: false })
            };

            const mansionGroup = new THREE.Group();

            // Ground Floor Plane
            const floorGeo = new THREE.BoxGeometry(100, 1, 100);
            const mainFloor = new THREE.Mesh(floorGeo, materials.woodFloor);
            mainFloor.position.y = -0.5;
            mainFloor.receiveShadow = true;
            mansionGroup.add(mainFloor);

            // Ceiling Plane
            const ceilingGeo = new THREE.BoxGeometry(100, 1, 100);
            const ceiling = new THREE.Mesh(ceilingGeo, materials.walls);
            ceiling.position.y = 18.5;
            ceiling.receiveShadow = true;
            mansionGroup.add(ceiling);

            // Helper: Wall Builder
            function createWall(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, materials.walls);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mansionGroup.add(mesh);
            }

            // Outer Perimeter Walls (Fully Opaque Enclosure)
            createWall(100, 18, 1, 0, 9, -50); // Back
            createWall(1, 18, 100, -50, 9, 0); // Left
            createWall(1, 18, 100, 50, 9, 0);  // Right
            createWall(38, 18, 1, -31, 9, 50); // Front Left
            createWall(38, 18, 1, 31, 9, 50);  // Front Right

            // Grand Foyer Marble Pillars
            const pillarGeo = new THREE.CylinderGeometry(1.5, 1.7, 18, 32);
            const pillarPositions = [
                [-14, 9, -15], [14, 9, -15],
                [-14, 9, 15],  [14, 9, 15]
            ];
            pillarPositions.forEach(pos => {
                const pillar = new THREE.Mesh(pillarGeo, materials.marble);
                pillar.position.set(pos[0], pos[1], pos[2]);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                mansionGroup.add(pillar);
            });

            // Interior Room Dividers
            createWall(1, 18, 40, -22, 9, -20);
            createWall(1, 18, 40, 22, 9, -20);
            createWall(30, 18, 1, -35, 9, 0);
            createWall(30, 18, 1, 35, 9, 0);

            // Grand Foyer Rug
            const rugGeo = new THREE.PlaneGeometry(20, 30);
            const rug = new THREE.Mesh(rugGeo, materials.rug);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.02, 0);
            rug.receiveShadow = true;
            mansionGroup.add(rug);

            // Furnishings: Dining Table
            const tableTopGeo = new THREE.BoxGeometry(10, 0.5, 22);
            const tableTop = new THREE.Mesh(tableTopGeo, materials.darkWood);
            tableTop.position.set(-34, 3, -25);
            tableTop.castShadow = true;
            tableTop.receiveShadow = true;
            mansionGroup.add(tableTop);

            // Table Legs
            const legGeo = new THREE.BoxGeometry(0.6, 3, 0.6);
            const legOffsets = [[-4.2, -9.5], [4.2, -9.5], [-4.2, 9.5], [4.2, 9.5]];
            legOffsets.forEach(off => {
                const leg = new THREE.Mesh(legGeo, materials.darkWood);
                leg.position.set(-34 + off[0], 1.5, -25 + off[1]);
                leg.castShadow = true;
                mansionGroup.add(leg);
            });

            // Fireplace Structure
            const mantelGeo = new THREE.BoxGeometry(12, 5, 3);
            const mantel = new THREE.Mesh(mantelGeo, materials.marble);
            mantel.position.set(0, 2.5, -48);
            mantel.castShadow = true;
            mansionGroup.add(mantel);

            const hearthGeo = new THREE.BoxGeometry(8, 3, 2);
            const hearthInnerMat = new THREE.MeshBasicMaterial({ color: 0x110500 });
            const hearth = new THREE.Mesh(hearthGeo, hearthInnerMat);
            hearth.position.set(0, 1.5, -47.5);
            mansionGroup.add(hearth);

            // Chandelier Structure
            const chandelierGroup = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(4, 0.15, 12, 32);
            const ring = new THREE.Mesh(ringGeo, materials.gold);
            ring.rotation.x = Math.PI / 2;
            chandelierGroup.add(ring);

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const cx = Math.cos(angle) * 4;
                const cz = Math.sin(angle) * 4;

                const candleGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
                const candleMat = new THREE.MeshBasicMaterial({ color: 0xffeedd });
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.set(cx, 0.4, cz);
                chandelierGroup.add(candle);

                // Chandelier Candle Light
                const cLight = new THREE.PointLight(0xffaa44, 0.6, 18);
                cLight.position.set(cx, 1.0, cz);
                chandelierGroup.add(cLight);
            }

            chandelierGroup.position.set(0, 14, 0);
            mansionGroup.add(chandelierGroup);

            scene.add(mansionGroup);
        }

        // ===================================================================
        // 6. LIGHTING ENGINE
        // ===================================================================
        function setupLighting() {
            // Soft Dark Ambient Base
            const ambient = new THREE.AmbientLight(0x221a24, 0.45);
            scene.add(ambient);

            // Main Foyer Light
            const foyerLight = new THREE.PointLight(0xffb866, 1.8, 50);
            foyerLight.position.set(0, 13, 0);
            foyerLight.castShadow = true;
            foyerLight.shadow.mapSize.width = 2048;
            foyerLight.shadow.mapSize.height = 2048;
            scene.add(foyerLight);

            // Warm Fireplace Glow
            const fireLight = new THREE.PointLight(0xff5500, 2.0, 25);
            fireLight.position.set(0, 2, -46);
            fireLight.castShadow = true;
            scene.add(fireLight);

            // Room Lights
            const sideLight1 = new THREE.PointLight(0xffaa55, 1.0, 30);
            sideLight1.position.set(-34, 10, -25);
            scene.add(sideLight1);

            const sideLight2 = new THREE.PointLight(0xffaa55, 1.0, 30);
            sideLight2.position.set(34, 10, -25);
            scene.add(sideLight2);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===================================================================
        // 7. GAME LOOP & PHYSICS TICK
        // ===================================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (controls.isLocked) {
                // Apply Velocity Damping
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= CONFIG.gravity * delta; // Gravity

                const speed = moveState.sprint ? CONFIG.runSpeed : CONFIG.walkSpeed;

                const moveVector = new THREE.Vector3();
                if (moveState.forward) moveVector.z += 1;
                if (moveState.backward) moveVector.z -= 1;
                if (moveState.left) moveVector.x -= 1;
                if (moveState.right) moveVector.x += 1;
                moveVector.normalize();

                if (moveState.forward || moveState.backward) velocity.z += moveVector.z * speed * 10.0 * delta;
                if (moveState.left || moveState.right) velocity.x += moveVector.x * speed * 10.0 * delta;

                // Move Player
                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                // Floor Collision Clamp
                if (controls.getObject().position.y < CONFIG.playerHeight) {
                    velocity.y = 0;
                    controls.getObject().position.y = CONFIG.playerHeight;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        // ===================================================================
        // 8. ENTRY POINT
        // ===================================================================
        window.onload = () => {
            initEngine();
            animate();
        };
    </script>
</body>
</html>
